default_language_version:
  python: python

repos:
  - repo: https://github.com/psf/black
    rev: 25.9.0
    hooks:
      - id: black
        language_version: python

  - repo: https://github.com/pycqa/isort
    rev: 6.1.0
    hooks:
      - id: isort

  - repo: https://github.com/pycqa/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        # Подключаем плагины сюда, а не отдельными репозиториями:
        additional_dependencies:
          - flake8-debugger==4.1.2

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/asottile/yesqa
    rev: v1.5.0
    hooks:
      - id: yesqa

  # Локальный spectacular, совместимый с Windows (env задаём через cmd /c)
  - repo: local
    hooks:
      - id: spectacular-validate
        name: spectacular validate OpenAPI
        language: system
        entry: python src/manage.py spectacular --settings=config.settings.dev --validate --fail-on-warn --file src/schema.yaml
        pass_filenames: false
        stages: [pre-commit, manual]

  -   repo: https://github.com/PyCQA/bandit
      rev: 1.7.9
      hooks:
        -   id: bandit
            name: bandit
            pass_filenames: false          # <-- ключевая строка
            args:
              - -r
              - src
              - -x
              - src/tests,migrations       # исключи тесты и миграции
              - -iii
              - -ll

  -   repo: local
      hooks:
          -   id: safety
              name: Safety (dependency audit)
              entry: safety check --full-report
              language: system
              types: [ python ]
              pass_filenames: false
              args:
                  - -r
                  - requirements-dev.txt
                  - --full-report

#  -   repo: https://github.com/pre-commit/mirrors-mypy
#      rev: v1.11.2
