#              additional_dependencies:
#                - django
#                - djangorestframework
#                - django-stubs
#                - djangorestframework-stubs
#                - python-dotenv
#                - celery
#                - redis
#                - django-filter
#                - drf-spectacular
#                - drf_spectacular_sidecar
#                - dj-database-url
#                - sentry-sdk
