[pytest]
DJANGO_SETTINGS_MODULE = config.settings.dev
python_files = tests.py test_*.py *_tests.py
testpaths = src
pythonpath = src
addopts = -ra --strict-markers --disable-warnings --cov=src --cov-report=term-missing --cov-report=xml:coverage.xml

markers =
    api: DRF API tests
    unit: Unit tests
    slow: Slow tests
