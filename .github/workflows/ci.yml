name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mini_crm
          POSTGRES_USER: mini_crm
          POSTGRES_PASSWORD: mini_crm
        ports:
          - "5432:5432"
        options: >-
          --health-cmd="pg_isready -U mini_crm -d mini_crm" --health-interval=10s --health-timeout=5s --health-retries=5

    env:
      POSTGRES_DB: mini_crm
      POSTGRES_USER: mini_crm
      POSTGRES_PASSWORD: mini_crm
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      DJANGO_SETTINGS_MODULE: config.settings.test
      PYTHONPATH: ./src

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Apply migrations
        run: python src/manage.py migrate --noinput

      - name: Run tests
        run: pytest -q --maxfail=1 --disable-warnings

      - name: Check migrations are up to date
        run: python src/manage.py makemigrations --check --dry-run
