name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # Быстрые тесты (SQLite, без внешних сервисов)
  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      PYTHONPATH: src
      SECRET_KEY: dummy
      ALLOWED_HOSTS: 127.0.0.1,localhost
      HEALTH_STRICT_DEFAULT: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Migrate
        run: python src/manage.py migrate --noinput

      - name: Run tests
        run: pytest -q

      - name: Upload coverage.xml
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

      - name: Extract coverage percent
        id: coverage
        run: |
          python - << 'PY'
          import os, xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          root = tree.getroot()
          rate = float(root.attrib.get('line-rate', '0'))
          percent = int(rate * 100)

          def badge_color(p: int) -> str:
              if p >= 90: return "brightgreen"
              if p >= 80: return "green"
              if p >= 70: return "yellowgreen"
              if p >= 60: return "yellow"
              if p >= 50: return "orange"
              return "red"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"coverage={percent}\n")
              f.write(f"color={badge_color(percent)}\n")
          PY

      - name: Upload coverage badge to gist
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}           # токен с правом gist:write
          gistID: e717d3682a0aef086b4a673a8683c47a # твой Gist ID
          filename: coverage.json
          label: coverage
          message: "${{ steps.coverage.outputs.coverage }}%"
          color: ${{ steps.coverage.outputs.color }}

  # Smoke: собираем образ и проверяем /health на реальном окружении
  build_and_smoke:
      runs-on: ubuntu-latest
      needs: test
      steps:
          -   uses: actions/checkout@v4

          # ⬇️ УБРАЛ setup-buildx — ничего не тянем с Docker Hub
          -   name: Build app image (prod target)
              run: docker build --target=prod -t mini_crm_base:ci .

          # Постгрес и Редис из GHCR Bitnami (не Docker Hub)
          -   name: Start Postgres & Redis (GHCR Bitnami)
              run: |
                  docker network create appnet

                  docker run -d --rm --name pg \
                    --network appnet \
                    -e POSTGRESQL_USERNAME=app \
                    -e POSTGRESQL_PASSWORD=app \
                    -e POSTGRESQL_DATABASE=app \
                    -p 5432:5432 \
                    ghcr.io/bitnami/postgresql:16

                  docker run -d --rm --name redis \
                    --network appnet \
                    -e ALLOW_EMPTY_PASSWORD=yes \
                    -p 6379:6379 \
                    ghcr.io/bitnami/redis:7

                  echo "⏳ Wait for Postgres..."
                  for i in {1..60}; do
                    docker exec pg bash -lc "pg_isready -U app" && break
                    sleep 1
                  done

          -   name: Run web container & probe /health
              run: |
                  docker run -d --rm --name web \
                    --network appnet \
                    -e DATABASE_URL=postgresql://app:app@pg:5432/app \
                    -e REDIS_URL=redis://redis:6379/1 \
                    -e CELERY_BROKER_URL=redis://redis:6379/1 \
                    -e CELERY_RESULT_BACKEND=redis://redis:6379/1 \
                    -e DJANGO_SETTINGS_MODULE=config.settings.prod \
                    -p 8000:8000 \
                    mini_crm_base:ci

                  echo "⏳ Wait for /health to be 200..."
                  for i in {1..30}; do
                    code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health/)
                    if [ "$code" = "200" ]; then
                      echo "✅ Health OK"
                      exit 0
                    fi
                    sleep 2
                  done

                  echo "❌ Health check failed. Logs:"
                  docker logs web || true
                  exit 1

          -   name: Dump logs on failure
              if: failure()
              run: |
                  echo "---- web logs ----"
                  docker logs web || true
                  echo "---- pg logs ----"
                  docker logs pg || true
                  echo "---- redis logs ----"
                  docker logs redis || true
