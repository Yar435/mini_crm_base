services:
  web:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: prod
    env_file: ../../.env
    entrypoint: ["/app/entrypoint.sh"]
    command: ["uvicorn", "config.asgi:application", "--host", "0.0.0.0", "--port", "8000", "--workers", "4", "--timeout-keep-alive", "65"]
    depends_on:
      - db
      - redis
    volumes:
      - static_volume:/app/staticfiles
    expose:
      - "8000"

  celery:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: prod
    env_file: ../../.env
    entrypoint: ["/app/entrypoint.sh"]
    command: ["celery", "-A", "config", "worker", "-l", "info"]
    depends_on:
      - db
      - redis

  beat:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: prod
    env_file: ../../.env
    entrypoint: ["/app/entrypoint.sh"]
    command: ["celery", "-A", "config", "beat", "-l", "info"]
    depends_on:
      - db
      - redis

  flower:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: prod
    env_file: ../../.env
    entrypoint: ["/app/entrypoint.sh"]
    command: ["celery", "-A", "config", "flower", "--port=5555"]
    depends_on:
      - redis
      - celery
    ports:
      - "5555:5555"

  celery-exporter:
    image: danihodovic/celery-exporter:latest
    environment:
      CE_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CE_LISTEN_ADDRESS: "0.0.0.0"
      CE_PORT: "9808"
      CE_NAMESPACE: "mini_crm"
    depends_on:
      - redis
      - celery
    ports:
      - "9808:9808"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    volumes:
      - ../prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - web

  grafana:
    image: grafana/grafana:11.1.4
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - web
    ports:
      - "80:80"
    volumes:
      - static_volume:/app/staticfiles:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mini_crm}
      POSTGRES_USER: ${POSTGRES_USER:-mini_crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mini_crm}
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - "5432"

  redis:
    image: redis:7-alpine
    expose:
      - "6379"

volumes:
  pgdata:
  static_volume:
