services:
  web:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: mini_crm_base_web:prod
    env_file: [../../.env]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    command: ["/app/entrypoint.sh", "uvicorn", "config.asgi:application", "--host", "0.0.0.0", "--port", "8000", "--workers", "4", "--timeout-keep-alive", "65"]
    depends_on: [db, redis]
    volumes:
      - static_volume:/app/staticfiles
    expose: ["8000"]

  celery:
    build:                # ← добавить
      context: ../..      # ← тот же контекст, что у web
      dockerfile: Dockerfile
    image: mini_crm_base_web:prod
    env_file: [../../.env]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    command: ["celery", "-A", "config.celery:app", "worker", "--loglevel=INFO"]
    depends_on: [db, redis, web]

  nginx:
    image: nginx:1.27-alpine
    depends_on: [web]
    ports: ["80:80"]
    volumes:
      - static_volume:/app/staticfiles:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mini_crm}
      POSTGRES_USER: ${POSTGRES_USER:-mini_crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mini_crm}
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose: ["5432"]

  redis:
    image: redis:7-alpine
    expose: ["6379"]

volumes:
  pgdata:
  static_volume:
